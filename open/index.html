<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrir en FastFlix</title>
  <meta name="description" content="Alguien te compartió contenido de FastFlix. Ábrelo en la app o instálala gratis.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Te compartieron algo en FastFlix">
  <meta property="og:description" content="Descubre dónde ver películas y series, listas de la comunidad y contenido gratis legal.">
  <meta property="og:image" content="https://fastflix.app/images/Fastflix-detalles3.jpeg">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1a0b2e 0%, #0d0d1a 100%);
      color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: rgba(255,255,255,.06); border-radius: 20px; padding: 36px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    img.logo { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { color: #c9c4d4; line-height: 1.5; margin-bottom: 26px; }
    .btn {
      display: block; width: 100%; padding: 15px; border-radius: 12px;
      font-size: 1.05rem; font-weight: 600; text-decoration: none; margin-bottom: 12px;
    }
    .primary { background: #7c3aed; color: #fff; }
    .secondary { background: transparent; color: #c9c4d4; border: 1px solid rgba(255,255,255,.2); }
    small { display: block; margin-top: 18px; color: #8a849a; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icons/Icon-maskable-192.png" alt="FastFlix" onerror="this.style.display='none'">
    <h1 id="title">Te compartieron algo en FastFlix</h1>
    <p id="desc">Abre el enlace en la app para ver el contenido. Si aún no la tienes, instálala gratis.</p>
    <a id="open" class="btn primary" href="#">Abrir en FastFlix</a>
    <a id="store" class="btn secondary" href="https://play.google.com/store/apps/details?id=app.fastflix">Instalar gratis en Google Play</a>
    <small>FastFlix · Descubre dónde ver películas y series</small>
  </div>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, '');
      var m = path.match(/^\/(l|m|s|f)\/([^\/]+)/);
      var kind = m ? m[1] : null;
      var labels = { l: 'una lista de películas', m: 'una película', s: 'una serie', f: 'una película gratis' };
      if (kind) {
        document.getElementById('title').textContent = 'Te compartieron ' + labels[kind];
      }
      var store = 'https://play.google.com/store/apps/details?id=app.fastflix';
      var storeWithRef = store + '&referrer=' + encodeURIComponent('utm_source=share&utm_medium=deeplink&utm_content=' + (kind || 'unknown'));
      document.getElementById('store').href = storeWithRef;

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var openBtn = document.getElementById('open');

      if (isAndroid && kind) {
        // Intent URL: abre la app si está instalada; si no, va a Play Store.
        var intent = 'intent://fastflix.app' + path + '#Intent;scheme=https;package=app.fastflix;' +
          'S.browser_fallback_url=' + encodeURIComponent(storeWithRef) + ';end';
        openBtn.href = intent;
        // Intento automático: si el App Link ya está verificado, Android abre
        // la app directamente sin llegar aquí. Si llegamos, probamos el intent.
        setTimeout(function () { location.href = intent; }, 400);
      } else {
        openBtn.textContent = 'Descargar FastFlix';
        openBtn.href = storeWithRef;
        document.getElementById('store').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
